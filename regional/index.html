    <body>
        <div class="container1">
            Activity Name
            <input
                id="activity-name"
                type=""
                name="Activity Name"
                style="width: 500px"
            />
            <br />
        </div>

        <section
            id="contact"
            class="contact-section section-padding"
        >
            <div
                id="rewards-container"
                class="container"
            >
                <strong>Reward Event</strong>
                <div class="contact-form">
                    <form
                        id="form"
                        name="contact-form"
                        method="post"
                    ></form>
                </div>
            </div>

            <!-- Button to Create Event -->
            <div class="container fixed-bottom create-event-container">
                <div
                    class="col-xs-6 col-sm-3 col-md-2"
                    style="right: 5%"
                >
                    <button
                        id="add-reward-button"
                        type="button"
                        class="btn btn-secondary"
                    >
                        +
                    </button>
                    <span style="padding-left: 4px">Add Reward</span>
                </div>
            </div>

            <!-- End Button -->
        </section>
